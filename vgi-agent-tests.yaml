# Private graders for the public vgi.agent_test_tasks in the worker's catalog metadata.
# `vgi-lint lint --ai` runs an agent on each prompt and grades it with check_sql.
# See https://github.com/Query-farm/vgi-lint-check (VGI920).
# Both tasks read live VGIN (Virginia) ArcGIS services, so the graders check
# ranges rather than exact counts.
tasks:
  - name: covington_parcels
    check_sql: >-
      SELECT count(*) BETWEEN 5000 AND 7000
      FROM arcgis.main.arcgis_query('https://vginmaps.vdem.virginia.gov/arcgis/rest/services/VA_Base_Layers/VA_Parcels/FeatureServer/0')
      WHERE FIPS = '51580'
  - name: largest_of_two_cities
    reference_sql: >-
      SELECT NAME FROM arcgis.main.arcgis_query('https://vginmaps.vdem.virginia.gov/arcgis/rest/services/VA_Base_Layers/VA_Admin_Boundaries/FeatureServer/1')
      WHERE NAME IN ('Covington', 'Buena Vista') ORDER BY AREASQMI DESC LIMIT 1
